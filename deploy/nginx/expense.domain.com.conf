# Nginx configuration for Expense Tracker API & PWA on dedicated subdomain
# Place in: /etc/nginx/sites-available/expense.yourdomain.com
# Symlink to: /etc/nginx/sites-enabled/expense.yourdomain.com

server {
    listen 80;
    server_name expense.yourdomain.com; # Replace with your actual subdomain

    # Redirect all HTTP traffic to HTTPS (handled by Certbot / Let's Encrypt)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name expense.yourdomain.com; # Replace with your actual subdomain

    # SSL certificates (managed by certbot --nginx -d expense.yourdomain.com)
    # ssl_certificate /etc/letsencrypt/live/expense.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/expense.yourdomain.com/privkey.pem;

    client_max_body_size 10M;

    # Backend API & Health
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for low-latency ingest acknowledgments
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
