# HSBC India — SMS Parser Templates
# Covers: HSBC Credit Card, HSBC Debit Card
# Normalized senders: HSBCIN, HSBC

- id: hsbc_credit_used_at
  issuer: HSBC
  card_type: credit
  senders: ["HSBCIN", "HSBC"]
  transaction_type: debit
  regex: >-
    HSBC\s+(?:creditcard|Credit\s+Card)\s+[xX*]+(\d{4})\s+used\s+at\s+(.+?)\s+for\s+(?:INR|Rs\.?)\s*([0-9,]+(?:\.[0-9]{1,2})?)\s+on\s+(\d{2}/\d{2}/\d{2,4})
  groups:
    card_last4: 1
    merchant: 2
    amount: 3
    txn_date: 4
  test_cases:
    - input: "HSBC creditcard xxxxx7764 used at raz*zomato online order for INR 325.83 on 03/08/26.Limit Rs 488674.17 Due Rs 325.83.Report fraud on +914061268002"
      expected:
        amount_paise: 32583
        card_last4: "7764"
        merchant: "Zomato"
    - input: "HSBC Credit Card xx7764 used at SHAWAYA PALACE for INR 1395.00 on 17/08/26. Avl limit INR 478214.65; due INR 10785.35. Call +914065118002 to report fraud."
      expected:
        amount_paise: 139500
        card_last4: "7764"
        merchant: "Shawaya Palace"

- id: hsbc_debit_card_spent
  issuer: HSBC
  card_type: debit
  senders: ["HSBCIN", "HSBC"]
  transaction_type: debit
  regex: >-
    HSBC:?Thank\s+you\s+for\s+using\s+HSBC\s+Debit\s+Card\s+[xX*]+(\d{4})\s+for\s+(?:INR|Rs\.?)\s*([0-9,]+(?:\.[0-9]{1,2})?)\s+on\s+(\d{1,2}[A-Za-z]{3})\s+at\s+(.+?)\s*(?:\.|\s+Your\s+available|\s+To\s+report)
  groups:
    card_last4: 1
    amount: 2
    txn_date: 3
    merchant: 4
  test_cases:
    - input: "HSBC:Thank you for using HSBC Debit Card XXXXX8290 for INR 907.00 on 17AUG at BATA INDIA LIMITED .Your available bal is INR 2,094.00 .To report fraudulent transaction call 18002673456 (local) Or +914061268007 (overseas)."
      expected:
        amount_paise: 90700
        card_last4: "8290"
        merchant: "Bata India Limited"

- id: hsbc_credit_spend
  issuer: HSBC
  card_type: credit
  senders: ["HSBCIN", "HSBC"]
  transaction_type: debit
  regex: >-
    (?:Rs\.?|INR)\s*([0-9,]+(?:\.[0-9]{1,2})?)\s+(?:was\s+)?(?:debited|charged|spent)\s+(?:from|on)\s+(?:your\s+)?HSBC\s+(?:Credit\s+)?(?:Card\s+)?(?:ending\s+|No\.?\s+)?[xX*]+(\d{4})(?:\s+at\s+(.+?))?[\.\s]
  groups:
    amount: 1
    card_last4: 2
    merchant: 3
  test_cases:
    - input: "Rs.3,200.00 was debited from your HSBC Credit Card ending xx5566 at IKEA."
      expected:
        amount_paise: 320000
        card_last4: "5566"
        merchant: "Ikea"
    - input: "INR 400.00 charged on your HSBC Card No. xx5566."
      expected:
        amount_paise: 40000
        card_last4: "5566"

- id: hsbc_debit_spend
  issuer: HSBC
  card_type: debit
  senders: ["HSBCIN", "HSBC"]
  transaction_type: debit
  regex: >-
    (?:Rs\.?|INR)\s*([0-9,]+(?:\.[0-9]{1,2})?)\s+(?:debited|withdrawn|charged)\s+from\s+(?:your\s+)?HSBC\s+(?:Savings\s+)?(?:Account|A/c)\s+[xX*]+(\d{4})
  groups:
    amount: 1
    card_last4: 2
  test_cases:
    - input: "Rs.1,500.00 debited from your HSBC Savings Account xx7788 via POS."
      expected:
        amount_paise: 150000
        card_last4: "7788"

- id: hsbc_credit_cashback
  issuer: HSBC
  card_type: credit
  senders: ["HSBCIN", "HSBC"]
  transaction_type: credit
  category_override: "Rewards & Cashback"
  regex: >-
    (?:Cashback|Reward)\s+of\s+(?:Rs\.?|INR)\s*([0-9,]+(?:\.[0-9]{1,2})?)\s+credited\s+to\s+(?:your\s+)?HSBC\s+Card\s+[xX*]+(\d{4})
  groups:
    amount: 1
    card_last4: 2
  test_cases:
    - input: "Cashback of Rs.150.00 credited to your HSBC Card xx5566. Great choice!"
      expected:
        amount_paise: 15000
        card_last4: "5566"
        category_override: "Rewards & Cashback"
