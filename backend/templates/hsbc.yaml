# HSBC India — SMS Parser Templates
# Covers: HSBC Credit Card, HSBC Debit Card
# Normalized senders: HSBCIN, HSBC

- id: hsbc_credit_used_at
  issuer: HSBC
  card_type: credit
  senders: ["HSBCIN", "HSBC"]
  transaction_type: debit
  regex: >-
    HSBC\s+creditcard\s+[xX*]+(\d{4})\s+used\s+at\s+(.+?)\s+for\s+(?:INR|Rs\.?)\s*([0-9,]+(?:\.[0-9]{1,2})?)\s+on\s+(\d{2}/\d{2}/\d{2,4})
  groups:
    card_last4: 1
    merchant: 2
    amount: 3
    txn_date: 4
  test_cases:
    - input: "HSBC creditcard xxxxx7764 used at raz*zomato online order for INR 325.83 on 03/08/26.Limit Rs 488674.17 Due Rs 325.83.Report fraud on +914061268002"
      expected:
        amount_paise: 32583
        card_last4: "7764"
        merchant: "Zomato"
    - input: "HSBC creditcard xxxxx7764 used at amazonin for INR 1008.00 on 06/08/26.Limit Rs 483599.35 Due Rs 5400.65.Report fraud on +914061268002"
      expected:
        amount_paise: 100800
        card_last4: "7764"
        merchant: "Amazon"

- id: hsbc_credit_spend
  issuer: HSBC
  card_type: credit
  senders: ["HSBCIN", "HSBC"]
  transaction_type: debit
  regex: >-
    (?:Rs\.?|INR)\s*([0-9,]+(?:\.[0-9]{1,2})?)\s+(?:was\s+)?(?:debited|charged|spent)\s+(?:from|on)\s+(?:your\s+)?HSBC\s+(?:Credit\s+)?(?:Card\s+)?(?:ending\s+|No\.?\s+)?[xX*]+(\d{4})(?:\s+at\s+(.+?))?[\.\s]
  groups:
    amount: 1
    card_last4: 2
    merchant: 3
  test_cases:
    - input: "Rs.3,200.00 was debited from your HSBC Credit Card ending xx5566 at IKEA."
      expected:
        amount_paise: 320000
        card_last4: "5566"
        merchant: "Ikea"
    - input: "INR 400.00 charged on your HSBC Card No. xx5566."
      expected:
        amount_paise: 40000
        card_last4: "5566"

- id: hsbc_debit_spend
  issuer: HSBC
  card_type: debit
  senders: ["HSBCIN", "HSBC"]
  transaction_type: debit
  regex: >-
    (?:Rs\.?|INR)\s*([0-9,]+(?:\.[0-9]{1,2})?)\s+(?:debited|withdrawn|charged)\s+from\s+(?:your\s+)?HSBC\s+(?:Savings\s+)?(?:Account|A/c)\s+[xX*]+(\d{4})
  groups:
    amount: 1
    card_last4: 2
  test_cases:
    - input: "Rs.1,500.00 debited from your HSBC Savings Account xx7788 via POS."
      expected:
        amount_paise: 150000
        card_last4: "7788"

- id: hsbc_credit_cashback
  issuer: HSBC
  card_type: credit
  senders: ["HSBCIN", "HSBC"]
  transaction_type: credit
  category_override: "Rewards & Cashback"
  regex: >-
    (?:Cashback|Reward)\s+of\s+(?:Rs\.?|INR)\s*([0-9,]+(?:\.[0-9]{1,2})?)\s+credited\s+to\s+(?:your\s+)?HSBC\s+Card\s+[xX*]+(\d{4})
  groups:
    amount: 1
    card_last4: 2
  test_cases:
    - input: "Cashback of Rs.150.00 credited to your HSBC Card xx5566. Great choice!"
      expected:
        amount_paise: 15000
        card_last4: "5566"
        category_override: "Rewards & Cashback"
