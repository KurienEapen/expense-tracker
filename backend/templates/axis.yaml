# Axis Bank (Indian Oil Co-brand) — SMS Parser Templates
# Covers: Axis Bank Indian Oil credit card (fuel surcharge waiver), Axis Bank credit card multi-line spend
# Normalized senders: AXISBK, AXISBKCC, AXISBN

- id: axis_multiline_spend
  issuer: Axis
  card_type: credit
  senders: ["AXISBK", "AXISBKCC"]
  transaction_type: debit
  regex: >-
    Spent\s+(?:INR|Rs\.?)\s*([0-9,]+(?:\.[0-9]{1,2})?)[\s\r\n]+(?:Axis\s+Bank\s+)?Card\s+no\.?\s+[xX*]+(\d{4})[\s\r\n]+(\d{2}-\d{2}-\d{2,4}(?:\s+\d{2}:\d{2}:\d{2}(?:\s+[A-Z]{3})?)?)[\s\r\n]+(.+?)[\s\r\n]+(?:Avl\s+Limit|Available\s+Limit)
  groups:
    amount: 1
    card_last4: 2
    txn_date: 3
    merchant: 4
  test_cases:
    - input: "Spent INR 40\nAxis Bank Card no. XX9456\n11-07-26 00:06:31 IST\nD LITE BAKE\nAvl Limit: INR 238373.09\nNot you? SMS BLOCK 9456 to 919951860002"
      expected:
        amount_paise: 4000
        card_last4: "9456"
        merchant: "D Lite Bake"

- id: axis_payment_received
  issuer: Axis
  card_type: credit
  senders: ["AXISBK", "AXISBKCC"]
  transaction_type: credit
  regex: >-
    Payment\s+of\s+(?:INR|Rs\.?)\s*([0-9,]+(?:\.[0-9]{1,2})?)\s+has\s+been\s+received\s+towards\s+your\s+Axis\s+Bank\s+Credit\s+Card\s+[xX*]+(\d{4})\s+on\s+(\d{2}-\d{2}-\d{2,4})
  groups:
    amount: 1
    card_last4: 2
    txn_date: 3
  test_cases:
    - input: "Payment of INR 1060.84 has been received towards your Axis Bank Credit Card XX9456 on 02-07-26 - Axis Bank"
      expected:
        amount_paise: 106084
        card_last4: "9456"
        transaction_type: "credit"

- id: axis_credit_spend
  issuer: Axis
  card_type: credit
  senders: ["AXISBK", "AXISBKCC"]
  transaction_type: debit
  regex: >-
    INR\s+([0-9,]+(?:\.[0-9]{1,2})?)\s+spent\s+on\s+Axis\s+\w+\s+Card\s+ending\s+(\d{4})\s+at\s+(.+?)\s+on\s+(\d{2}-\d{2}-\d{4}|\d{2}/\d{2}/\d{4}|\d{2}-\w{3}-\d{4})
  groups:
    amount: 1
    card_last4: 2
    merchant: 3
    txn_date: 4
  test_cases:
    - input: "INR 2,000.00 spent on Axis IOCL Card ending 1122 at INDIAN OIL CORP on 29-09-2026. Surcharge waiver eligible."
      expected:
        amount_paise: 200000
        card_last4: "1122"
        merchant: "Indian Oil Corp"

- id: axis_fuel_surcharge_waiver
  issuer: Axis
  card_type: credit
  senders: ["AXISBK", "AXISBKCC"]
  transaction_type: surcharge_waiver
  regex: >-
    (?:Fuel\s+surcharge\s+waiver|Surcharge\s+waiver)\s+of\s+(?:Rs\.?|INR)\s*([0-9,]+(?:\.[0-9]{1,2})?)\s+(?:applied|credited|reversed)\s+(?:on|to)\s+(?:your\s+)?(?:Axis\s+)?(?:IOCL\s+)?Card\s+[xX*]+(\d{4})
  groups:
    amount: 1
    card_last4: 2
  category_override: "Fuel"
  test_cases:
    - input: "Fuel surcharge waiver of Rs.40.00 applied on your Axis IOCL Card xx1122."
      expected:
        amount_paise: 4000
        card_last4: "1122"
        category_override: "Fuel"

- id: axis_credit_general
  issuer: Axis
  card_type: credit
  senders: ["AXISBK", "AXISBKCC"]
  transaction_type: debit
  regex: >-
    (?:Rs\.?|INR)\s*([0-9,]+(?:\.[0-9]{1,2})?)\s+(?:debited|charged)\s+(?:from|on)\s+(?:your\s+)?Axis\s+Bank\s+(?:Credit\s+)?(?:Card|A/c)\s+[xX*]+(\d{4})
  groups:
    amount: 1
    card_last4: 2
  test_cases:
    - input: "Rs.1,500.00 debited from your Axis Bank Credit Card xx1122."
      expected:
        amount_paise: 150000
        card_last4: "1122"
